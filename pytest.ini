[pytest]
testpaths = tests
# test_gemini_isolated.py is a manual script, not an automated test -- it needs
# a live API key, a microphone or a WAV file, and a human to talk to it.
# Run it directly:  .venv/bin/python tests/test_gemini_isolated.py
addopts = -q --ignore=tests/test_gemini_isolated.py
filterwarnings =
    # audioop is deprecated and gone in 3.13. That is precisely why this
    # project pins Python 3.11 -- the warning is expected, not actionable.
    ignore:'audioop' is deprecated:DeprecationWarning
